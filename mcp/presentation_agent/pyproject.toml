[project]
name = "presentation-mcp"
version = "0.1.0"
description = "Skeleton MCP server for orchestrating presentation authoring."
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.15.0",
    "pydantic>=2.6.0",
    "boto3>=1.40.40",
    "openai>=1.109.1",
    "pandas>=2.3.2",
    "numpy>=2.2.6",
    "matplotlib>=3.10.6",
    "seaborn>=0.13.2",
    "plotly>=6.3.0",
    "statsmodels>=0.14.5",
    "python-dotenv>=1.0.1",
    "python-pptx>=0.6.23",
    "langchain[openai]>=0.3.27",
    "langgraph>=0.6.8",
    "langchain-mcp-adapters>=0.1.11",
    "aspose-slides>=25.9.0",
    "pymupdf>=1.26.5",
]

[tool.mcp]
entry_point = "presentation_agent.main:main"
